    tests_run: [python scripts/benchmark/run_lodo.py --demo --out results/demo_lodo_check, python scripts/model/run_endpoint_module_analysis.py, python scripts/model/run_endpoint_module_analysis.py --processed-dir data/processed/bulk --out results/endpoint_modules_wordfull_v2, python scripts/model/run_endpoint_module_analysis.py --processed-dir data/processed/bulk --out results/endpoint_modules_heuristic_core_locked_gpu --only-endpoint primary_recist --only-stratum melanoma_core_high_evidence --only-stratum melanoma_recist_supported_primary --optimizer-population 2 --optimizer-generations 1 --optimizer-n-jobs 1 --optimizer-use-gpu --optimizer-scope all, python scripts/analysis/run_locked_external_panel_validation.py --processed-dir data/processed/bulk --out results/locked_external_panel_validation, python scripts/analysis/run_pd1_like_external_rescue.py --processed-dir data/processed/bulk --out results/pd1_like_external_rescue, python scripts/benchmark/run_locked_external.py --processed-dir data/processed/bulk --out results/locked_external_panel_validation, pytest -q tests/test_endpoint_modules.py, pytest -q]
    blocking_issues: []
    notes: Leave-one-dataset-out runner uses holdout cohorts and writes predictions and metrics. Endpoint-module LODO now separates RECIST-supported melanoma primary cohorts from binary R/NR melanoma stress-test cohorts and includes the Word-spec signed-rank ecological graph model plus a training-only heuristic ecological optimizer without holdout leakage. Focused primary melanoma outputs are available under results/endpoint_modules_heuristic_core_locked_gpu. Locked external and clinical-assay panel validation now uses discovery-only thresholds from GSE91061/GSE78220/PRJEB23709_PD1_PRE and evaluates GSE145996, PHS000452_LIU_LIKE_PRE, PRJEB23709_COMBO_PRE, GSE93157, and GSE140901 without threshold leakage. A secondary PD1-like transfer-head rescue improves the weak strict PD1-like stress set from locked AUROC 0.571 to AUROC 0.595 with improved ECE, but is claim-bounded as model-development rescue pending fresh validation.
