    notes: "Added a registered GEO preprocessing path for GSE122220, a 10-sample pretreatment melanoma tumor-biopsy Illumina HumanHT-12 V4 expression-array cohort. The pipeline downloads the GEO series matrix and GPL10558 annotation, maps probes to gene symbols, writes sample-by-gene log2 expression, metadata, locked-validation sample manifest, clinical annotation, and panel-overlap QC. GEO sample characteristics provide CR/PR/SD/PD response categories, yielding 4 responders and 6 nonresponders for the primary CR/PR versus SD/PD endpoint; locked panel coverage is 53/62 genes. Low-n array sensitivity scores are favorable (best locked strict-recist sensitivity AUROC 0.875; primary-recist AUROC 0.792), but this is explicitly retained as low-n microarray platform sensitivity only. Strict-compatible public melanoma external evidence remains below the AUROC >=0.70 target: expanded public melanoma best locked AUROC is 0.660, current strict PD1-like stress best remains 0.679, and the top-tier audit remains 25 PASS, 10 PARTIAL, and 1 GAP."
