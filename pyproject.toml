[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econiche-opt"
version = "0.3.1"
description = "EcoNiche-Opt package for multicohort ICB response benchmarking and ecological module scoring."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "EcoNiche-Opt contributors" }]
keywords = ["immunotherapy", "biomarker", "transcriptomics", "machine-learning", "bioinformatics"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "pyarrow>=15.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
geo = ["GEOparse>=2.0.4"]
survival = ["lifelines>=0.28"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
econiche-opt = "econiche_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
