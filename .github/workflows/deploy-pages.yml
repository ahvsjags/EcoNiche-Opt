name: deploy-research-portal

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "deliverables/prospective_validation/locked_scoring_spec.json"
      - "deliverables/prospective_validation/locked_panel_genes.tsv"
      - "results/endpoint_modules_heuristic_core_locked_gpu/endpoint_module_summary.tsv"
      - "results/locked_external_panel_validation_calibrated_20260519/locked_external_metrics.tsv"
      - "figures/article/figure_manifest.tsv"
      - "scripts/web/build_portal_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate portal data from registered artifacts
        run: python scripts/web/build_portal_data.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
